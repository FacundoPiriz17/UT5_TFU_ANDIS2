worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    sendfile on;
    gzip on;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/css text/plain text/xml;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    # Resuelve DNS nuevamente al recrear un servicio; no conserva IPs anteriores.
    resolver 127.0.0.11 valid=2s ipv6=off;
    server {
        listen 80;
        client_max_body_size 64k;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location = /gateway/health { default_type application/json; return 200 '{"status":"ok","service":"gateway"}'; }
        location /static/ {
            alias /var/www/static/;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Served-By "gateway-nginx" always;
        }
        # El antiguo detalle GET pasa por el adaptador SOAP en Comercial.
        location ~ ^/juegos/[0-9]+$ {
            limit_req zone=api_limit burst=20 nodelay;
            set $destination catalogo:8000;
            if ($request_method = GET) { set $destination comercial:8000; }
            proxy_pass http://$destination$request_uri;
        }
        location /juegos {
            limit_req zone=api_limit burst=20 nodelay;
            set $catalog catalogo:8000;
            proxy_pass http://$catalog$request_uri;
        }
        location /soap/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $catalog catalogo:8000;
            proxy_pass http://$catalog$request_uri;
        }
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            set $commercial comercial:8000;
            proxy_pass http://$commercial$request_uri;
        }
        error_page 429 = @limited;
        location @limited { default_type application/json; return 429 '{"detail":"Has excedido el límite de peticiones"}'; }
        error_page 502 504 = @unavailable;
        location @unavailable { default_type application/json; return 503 '{"detail":"Servicio temporalmente indisponible"}'; }
    }
}
