# docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d --build
services:
  catalogo:
    volumes:
      - ./services/catalogo:/app/services/catalogo
      - ./app:/app/app
      - ./security:/app/security
      - ./contracts:/app/contracts:ro
    command: uvicorn services.catalogo.main:app --host 0.0.0.0 --port 8000 --reload
  comercial:
    volumes:
      - ./services/comercial:/app/services/comercial
      - ./app:/app/app
      - ./security:/app/security
      - ./contracts:/app/contracts:ro
    command: uvicorn services.comercial.main:app --host 0.0.0.0 --port 8000 --reload
